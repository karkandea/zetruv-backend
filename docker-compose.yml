services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zetruv}
      POSTGRES_USER: ${POSTGRES_USER:-zetruv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zetruv}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zetruv} -d ${POSTGRES_DB:-zetruv}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Zetruv.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-zetruv};Username=${POSTGRES_USER:-zetruv};Password=${POSTGRES_PASSWORD:-zetruv}
      Jwt__Key: ${JWT_KEY}
      CmsAdmin__Email: ${CMS_ADMIN_EMAIL}
      CmsAdmin__Password: ${CMS_ADMIN_PASSWORD}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${CMS_ORIGIN:-http://localhost:5174}
      Payments__Provider: ${PAYMENTS_PROVIDER:-mock}
      Payments__Mock__WebhookSecret: ${PAYMENTS_MOCK_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
