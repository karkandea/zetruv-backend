# Build and synthetic contract parity; host integration and deployment are separate gates.
when:
  - event: [push, manual]
    branch: ci/woodpecker-parity-pilot
steps:
  - name: build-contracts
    image: mcr.microsoft.com/dotnet/sdk:10.0
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      ConnectionStrings__Postgres: "Host=127.0.0.1;Port=1;Database=unused;Username=unused;Password=unused"
    commands:
      - dotnet restore src/Zetruv.Api/Zetruv.Api.csproj
      - dotnet tool restore
      - dotnet build src/Zetruv.Api/Zetruv.Api.csproj --configuration Release --no-restore
      - dotnet run --project tests/XenditContractSmoke/XenditContractSmoke.csproj --configuration Release
      - dotnet run --project tests/MidtransContractSmoke/MidtransContractSmoke.csproj --configuration Release
      - dotnet ef migrations has-pending-model-changes --project src/Zetruv.Api/Zetruv.Api.csproj --startup-project src/Zetruv.Api/Zetruv.Api.csproj --configuration Release --no-build
      - bash scripts/smoke-production-provider-guard.sh
  - name: runtime-config
    image: docker:29-cli
    commands:
      - apk add --no-cache bash openssl
      - bash scripts/smoke-runtime-config.sh
