name: Temporary Client Catalog Seed

on:
  push:
    branches:
      - temp/client-catalog-seed

permissions:
  contents: read

jobs:
  seed:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Seed client catalog through DEV CMS API
        shell: bash
        run: |
          set -euo pipefail
          sudo -n -u zetruv-deploy bash -lc 'cd /opt/zetruv-backend-dev && python3 -' <<'PY'
          import json, urllib.request, urllib.error
          from pathlib import Path

          def read_env(path):
              result = {}
              for raw in Path(path).read_text().splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  k, v = line.split('=', 1)
                  result[k] = v
              return result

          env = read_env('.env')
          base = 'https://' + env['API_DOMAIN']

          def request(method, path, payload=None, token=None):
              data = None if payload is None else json.dumps(payload).encode()
              headers = {'Content-Type': 'application/json'}
              if token:
                  headers['Authorization'] = 'Bearer ' + token
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as r:
                      body = r.read().decode()
                      if not body:
                          return None
                      return json.loads(body)
              except urllib.error.HTTPError as e:
                  body = e.read().decode(errors='replace')
                  raise RuntimeError(f'{method} {path} -> HTTP {e.code}: {body}') from e

          login = request('POST', '/api/v1/cms/auth/login', {
              'email': env['CMS_ADMIN_EMAIL'],
              'password': env['CMS_ADMIN_PASSWORD'],
          })
          token = login.get('accessToken') or login.get('AccessToken')
          assert token, 'CMS login did not return accessToken'
          print('CMS_LOGIN_OK')

          categories = request('GET', '/api/v1/cms/catalog/categories', token=token)
          login_category = next((x for x in categories if x['kind'] == 'TopUpLogin' and x['isActive']), None)
          assert login_category, 'Active TopUpLogin category not found'

          game_specs = [
              {'name':'eFootball Mobile','slug':'efootball-mobile','sortOrder':20},
              {'name':'Call of Duty Mobile','slug':'call-of-duty-mobile','sortOrder':21},
          ]

          games = request('GET', '/api/v1/cms/catalog/games', token=token)
          by_game_slug = {x['slug']: x for x in games}
          for spec in game_specs:
              payload = {
                  'name': spec['name'], 'slug': spec['slug'], 'publisher': None, 'imageUrl': None,
                  'isActive': True, 'isPopular': False, 'sortOrder': spec['sortOrder'],
              }
              existing = by_game_slug.get(spec['slug'])
              if existing:
                  request('PUT', f"/api/v1/cms/catalog/games/{existing['id']}", payload, token)
              else:
                  request('POST', '/api/v1/cms/catalog/games', payload, token)
              print('GAME_OK', spec['slug'])

          games = request('GET', '/api/v1/cms/catalog/games', token=token)
          by_game_slug = {x['slug']: x for x in games}

          product_specs = [
              {
                  'name':'eFootball Mobile','slug':'efootball-mobile','gameSlug':'efootball-mobile','sortOrder':20,
                  'shortDescription':'Top Up eFootball Mobile via login akun.',
                  'description':'Manual login fulfillment. Data login dikirim saat checkout dan diproses oleh admin.',
                  'fields':[
                      {'key':'email','label':'Email Konami','scope':'LoginCredential','type':'Email','placeholder':'Masukkan Email Konami','helpText':'Email KONAMI yang digunakan untuk login.','isRequired':True,'isSensitive':False,'maxLength':200,'options':None,'sortOrder':10},
                      {'key':'password','label':'Password Konami','scope':'LoginCredential','type':'Password','placeholder':'Masukkan Password Konami','helpText':'Password hanya digunakan untuk proses fulfillment.','isRequired':True,'isSensitive':True,'maxLength':200,'options':None,'sortOrder':20},
                      {'key':'nickname','label':'Nickname','scope':'LoginCredential','type':'Text','placeholder':'Masukkan nickname akun','helpText':'Nickname akun game untuk membantu admin memastikan akun yang benar.','isRequired':True,'isSensitive':False,'maxLength':120,'options':None,'sortOrder':30},
                  ],
              },
              {
                  'name':'Call of Duty Mobile','slug':'call-of-duty-mobile','gameSlug':'call-of-duty-mobile','sortOrder':21,
                  'shortDescription':'Top Up Call of Duty Mobile via login akun.',
                  'description':'Manual login fulfillment. Data login dikirim saat checkout dan diproses oleh admin.',
                  'fields':[
                      {'key':'email','label':'Email','scope':'LoginCredential','type':'Email','placeholder':'Masukkan email akun','helpText':'Email akun Call of Duty Mobile yang digunakan untuk login.','isRequired':True,'isSensitive':False,'maxLength':200,'options':None,'sortOrder':10},
                      {'key':'password','label':'Password','scope':'LoginCredential','type':'Password','placeholder':'Masukkan password akun','helpText':'Password hanya digunakan untuk proses fulfillment.','isRequired':True,'isSensitive':True,'maxLength':200,'options':None,'sortOrder':20},
                      {'key':'nickname','label':'Nickname','scope':'LoginCredential','type':'Text','placeholder':'Masukkan nickname akun','helpText':'Nickname akun game untuk membantu admin memastikan akun yang benar.','isRequired':True,'isSensitive':False,'maxLength':120,'options':None,'sortOrder':30},
                  ],
              },
          ]

          products = request('GET', '/api/v1/cms/catalog/products', token=token)
          by_product_slug = {x['slug']: x for x in products}
          for spec in product_specs:
              game = by_game_slug[spec['gameSlug']]
              payload = {
                  'categoryId': login_category['id'], 'gameId': game['id'],
                  'name': spec['name'], 'slug': spec['slug'],
                  'shortDescription': spec['shortDescription'], 'description': spec['description'],
                  'thumbnailUrl': None, 'kind': 'TopUpLogin', 'fulfillmentMethod': 'MANUAL_LOGIN',
                  'requiresGameAccountValidation': False, 'isActive': False, 'isFeatured': False,
                  'sortOrder': spec['sortOrder'],
              }
              existing = by_product_slug.get(spec['slug'])
              if existing:
                  request('PUT', f"/api/v1/cms/catalog/products/{existing['id']}", payload, token)
              else:
                  request('POST', '/api/v1/cms/catalog/products', payload, token)
              print('PRODUCT_OK', spec['slug'])

          products = request('GET', '/api/v1/cms/catalog/products', token=token)
          by_product_slug = {x['slug']: x for x in products}
          for spec in product_specs:
              product = by_product_slug[spec['slug']]
              detail = request('GET', f"/api/v1/cms/catalog/products/{product['id']}", token=token)
              current_fields = {x['key']: x for x in detail.get('inputFields', [])}
              for field in spec['fields']:
                  existing = current_fields.get(field['key'])
                  if existing:
                      request('PUT', f"/api/v1/cms/catalog/products/{product['id']}/input-fields/{existing['id']}", field, token)
                  else:
                      request('POST', f"/api/v1/cms/catalog/products/{product['id']}/input-fields", field, token)
              print('FIELDS_OK', spec['slug'])

          products = request('GET', '/api/v1/cms/catalog/products', token=token)
          by_product_slug = {x['slug']: x for x in products}
          for spec in product_specs:
              product = by_product_slug[spec['slug']]
              detail = request('GET', f"/api/v1/cms/catalog/products/{product['id']}", token=token)
              keys = [x['key'] for x in detail.get('inputFields', [])]
              assert keys == ['email','password','nickname'], (spec['slug'], keys)
              assert not product['isActive'], spec['slug'] + ' must remain inactive until client variants/prices arrive'
              assert product['activeVariantCount'] == 0, spec['slug'] + ' unexpectedly has variants'
              assert not any(k in {'phone','whatsapp','wa'} for k in keys), 'WhatsApp must remain global checkout data'
              print('CMS_VERIFY_OK', spec['slug'], keys)

          public = request('GET', '/api/v1/catalog/products?kind=TopUpLogin&pageSize=50')
          public_slugs = {x['slug'] for x in public.get('items', [])}
          for spec in product_specs:
              assert spec['slug'] not in public_slugs, spec['slug'] + ' leaked to public catalog before pricing'
              print('PUBLIC_HIDDEN_OK', spec['slug'])

          print('PASS: client manual-login catalog configured in DEV CMS; WhatsApp stays global; products remain safely inactive pending variants/prices.')
          PY
