name: Temporary DEV Payment Recovery Smoke

on:
  push:
    branches:
      - feat/payment-recovery-backend

jobs:
  smoke:
    runs-on: [self-hosted, Linux, X64, zetruv-backend]
    timeout-minutes: 10
    steps:
      - name: Concurrent payment recovery smoke against DEV
        shell: bash
        run: |
          set -euo pipefail
          API='https://api-dev.zetruv.com'
          EMAIL="payment-recovery-smoke-${GITHUB_RUN_ID}@zetruv.local"

          curl -fsS "$API/health" >/dev/null
          curl -fsS "$API/api/v1/catalog/products/mobile-legends" > /tmp/catalog.json
          read -r PRODUCT_ID VARIANT_ID < <(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/catalog.json'))
          v=next(x for x in d['variants'] if x.get('isAvailable', True))
          print(d['id'], v['id'])
          PY
          )

          curl -fsS -X POST "$API/api/v1/game-account/validate" \
            -H 'Content-Type: application/json' \
            -d "{\"productId\":\"$PRODUCT_ID\",\"fields\":{\"userid\":\"recovery-${GITHUB_RUN_ID}\",\"zoneid\":\"1\"}}" \
            > /tmp/validation.json
          VALIDATION_ID=$(python3 -c 'import json; print(json.load(open("/tmp/validation.json"))["validationId"])')

          curl -fsS -X POST "$API/api/v1/checkout/orders" \
            -H 'Content-Type: application/json' \
            -d "{\"customerName\":\"Payment Recovery Smoke\",\"customerEmail\":\"$EMAIL\",\"items\":[{\"productVariantId\":\"$VARIANT_ID\",\"quantity\":1,\"gameAccountValidationId\":\"$VALIDATION_ID\"}]}" \
            > /tmp/order.json
          ORDER_ID=$(python3 -c 'import json; print(json.load(open("/tmp/order.json"))["id"])')
          ORDER_NO=$(python3 -c 'import json; print(json.load(open("/tmp/order.json"))["orderNumber"])')
          ACCESS_TOKEN=$(python3 -c 'import json; print(json.load(open("/tmp/order.json"))["orderAccessToken"])')

          pay() {
            curl -fsS -X POST "$API/api/v1/checkout/orders/$ORDER_ID/payment" \
              -H "X-Order-Access-Token: $ACCESS_TOKEN"
          }

          pay > /tmp/payment-1.json & P1=$!
          pay > /tmp/payment-2.json & P2=$!
          wait "$P1"
          wait "$P2"

          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/payment-1.json'))
          b=json.load(open('/tmp/payment-2.json'))
          assert a['providerReference'] and a['providerReference'] == b['providerReference'], (a,b)
          assert a['paymentUrl'] and a['paymentUrl'] == b['paymentUrl'], (a,b)
          assert a['expiresAt'] and b['expiresAt'], (a,b)
          assert sorted([a['isRecovery'], b['isRecovery']]) == [False, True], (a,b)
          assert a['paymentStatus'] == 'Pending' and b['paymentStatus'] == 'Pending', (a,b)
          PY

          curl -fsS -X POST "$API/api/v1/orders/lookup" \
            -H 'Content-Type: application/json' \
            -d "{\"orderNumber\":\"$ORDER_NO\",\"customerEmail\":\"$EMAIL\"}" \
            > /tmp/lookup.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/lookup.json'))
          assert x['canInitiatePayment'] is True, x
          assert x['hasActivePaymentSession'] is True, x
          assert x['activePaymentExpiresAt'], x
          assert x['orderAccessToken'], x
          PY

          pay > /tmp/payment-3.json
          python3 - <<'PY'
          import json
          first=json.load(open('/tmp/payment-1.json'))
          second=json.load(open('/tmp/payment-2.json'))
          third=json.load(open('/tmp/payment-3.json'))
          ref=first['providerReference']
          assert second['providerReference'] == ref and third['providerReference'] == ref
          assert third['isRecovery'] is True
          print('PASS: concurrent payment initiation reused exactly one active provider session; lookup exposes recoverable session state')
          PY
