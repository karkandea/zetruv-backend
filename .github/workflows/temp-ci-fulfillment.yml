name: Temporary Fulfillment Hardening CI

on:
  push:
    branches:
      - feat/fulfillment-audit-hardening

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, zetruv-backend]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/Zetruv.Api/Zetruv.Api.csproj
      - name: Restore dotnet tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build src/Zetruv.Api/Zetruv.Api.csproj --configuration Release --no-restore
      - name: Verify EF model is migrated
        env:
          ConnectionStrings__Postgres: Host=127.0.0.1;Port=1;Database=unused;Username=unused;Password=unused
        run: dotnet ef migrations has-pending-model-changes --project src/Zetruv.Api/Zetruv.Api.csproj --startup-project src/Zetruv.Api/Zetruv.Api.csproj --configuration Release --no-build
      - name: Runtime configuration smoke
        run: bash scripts/smoke-runtime-config.sh
      - name: Production safety guard smoke
        run: bash scripts/smoke-production-provider-guard.sh
