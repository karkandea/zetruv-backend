name: Temporary Manual Login Lifecycle Integration

on:
  push:
    branches:
      - feat/payment-recovery-backend

permissions:
  contents: write

jobs:
  integrate:
    runs-on: [self-hosted, Linux, X64, zetruv-backend]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payment-recovery-backend
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/Zetruv.Api/Zetruv.Api.csproj
      - name: Restore dotnet tools
        run: dotnet tool restore
      - name: Apply lifecycle patches
        run: python3 scripts/temp-patch-manual-login-lifecycle.py
      - name: Build
        run: dotnet build src/Zetruv.Api/Zetruv.Api.csproj --configuration Release --no-restore
      - name: Verify EF model is migrated
        env:
          ConnectionStrings__Postgres: Host=127.0.0.1;Port=1;Database=unused;Username=unused;Password=unused
        run: dotnet ef migrations has-pending-model-changes --project src/Zetruv.Api/Zetruv.Api.csproj --startup-project src/Zetruv.Api/Zetruv.Api.csproj --configuration Release --no-build
      - name: Commit integration changes
        run: |
          if git diff --quiet -- src/Zetruv.Api; then
            echo "No source changes generated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Zetruv.Api
          git commit -m "fix: harden manual login credential lifecycle"
          git push origin HEAD:feat/payment-recovery-backend
