name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/Zetruv.Api/Zetruv.Api.csproj
      - name: Build
        run: dotnet build src/Zetruv.Api/Zetruv.Api.csproj --configuration Release --no-restore
