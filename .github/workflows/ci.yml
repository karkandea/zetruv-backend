name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, zetruv-backend]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled .NET 10 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_version="$(dotnet --version)"
          if [[ "${sdk_version}" != 10.* ]]; then
            echo "Runner must provide a .NET 10 SDK; found ${sdk_version}." >&2
            exit 1
          fi
          echo "Using preinstalled .NET SDK ${sdk_version}"
      - name: Restore
        run: dotnet restore src/Zetruv.Api/Zetruv.Api.csproj
      - name: Build
        run: dotnet build src/Zetruv.Api/Zetruv.Api.csproj --configuration Release --no-restore
