name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, zetruv-backend]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/Zetruv.Api/Zetruv.Api.csproj
      - name: Build
        run: dotnet build src/Zetruv.Api/Zetruv.Api.csproj --configuration Release --no-restore
